<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JEOPARDY! — Buzzer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <div class="logo">JEOPARDY! <small>BUZZER 🔔</small></div>
  <div class="nav"><button data-mute class="ghost" onclick="JSound.setMuted(!JSound.isMuted())">🔊 Mute</button></div>
</div>

<div class="wrap">
  <div id="joinView" class="panel join-card">
    <h2 style="margin-top:0">Join the game 🎮</h2>
    <label class="muted">YOUR NAME</label>
    <input id="nameInput" maxlength="20" placeholder="e.g. Alex" autocomplete="off">
    <div style="height:10px"></div>
    <button id="joinBtn" style="width:100%;font-size:20px">Join →</button>
    <p class="muted">Stay on this page. Your buzzer works only while this tab is open. <span id="conn1" class="conn"></span></p>
  </div>

  <div id="gameView" style="display:none">
    <div class="panel" style="text-align:center">
      <div class="status-pill" id="status">Waiting for host…</div>
      <div id="cluePreview" class="muted"></div>
      <div class="buzz-wrap"><button id="buzzBtn" disabled>🔔<br>BUZZ</button></div>
      <div style="font-size:22px">Hi <b id="myName" class="gold"></b>! Score: <b id="myScore" class="gold">$0</b></div>
      <div class="muted"><span id="conn2" class="conn"></span></div>
    </div>
    <div id="wagerView" class="panel" style="display:none;text-align:center;margin-top:12px">
      <h2 style="margin:0 0 6px">⭐ DAILY DOUBLE ⭐</h2>
      <div class="muted">Your score: <b id="wagerScore" class="gold">$0</b> • max wager: <b id="wagerMax" class="gold">$1000</b></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input id="wagerInput" type="number" min="0" step="100" value="500" inputmode="numeric" style="flex:1">
        <button id="wagerBtn" style="flex:1">Lock wager 💰</button>
      </div>
    </div>
    <div class="panel" style="margin-top:12px">
      <b class="gold">SCOREBOARD</b>
      <div id="scores" class="scores"></div>
    </div>
  </div>
</div>

<script src="/sound.js"></script>
<script src="/common.js"></script>
<script>
const nameInput = document.getElementById('nameInput');
nameInput.value = J.getName();
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') join(); });

const sock = J.connect({
  onStatus: s => {
    document.getElementById('conn1').textContent = s;
    document.getElementById('conn2').textContent = s;
    if (s !== 'connected ✓') {
      // offline: make it obvious the buzzer can't work right now
      // (direct lookup: this can fire before `buzzBtn` is initialized)
      document.getElementById('status').textContent = '🔌 reconnecting…';
      const bb = document.getElementById('buzzBtn');
      if (bb) { bb.disabled = true; bb.classList.remove('ready'); }
    }
  },
  // fires on first connect AND every reconnect (e.g. server restarted):
  // re-register so the server knows this socket again (quietly, no chime spam)
  onOpen: () => {
    if (J.getName()) sock.send({ type: 'join', name: J.getName(), clientId: J.getClientId(), rejoin: true });
  },
  onState: render,
  onEvent: ev => {
    if (ev.event === 'buzz_win' && ev.playerId === J.getClientId()) {
      if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
    }
  },
});

document.getElementById('joinBtn').onclick = join;
if (J.getName()) join(true);

function join(silent) {
  const name = nameInput.value.trim().slice(0, 20) || 'Player';
  J.setName(name);
  sock.send({ type: 'join', name, clientId: J.getClientId() });
  document.getElementById('joinView').style.display = 'none';
  document.getElementById('gameView').style.display = '';
  document.getElementById('myName').textContent = name;
  if (!silent && window.JSound) JSound.join();
}

const buzzBtn = document.getElementById('buzzBtn');
buzzBtn.addEventListener('pointerdown', e => { e.preventDefault(); buzz(); });
function buzz() {
  sock.send({ type: 'buzz', clientId: J.getClientId() });
  if (navigator.vibrate) navigator.vibrate(30);
}

function render(state) {
  if (!J.getName()) return;
  document.getElementById('joinView').style.display = 'none';
  document.getElementById('gameView').style.display = '';
  const me = state.players.find(p => p.id === J.getClientId());
  document.getElementById('myName').textContent = me ? me.name : J.getName();
  const sc = document.getElementById('myScore');
  sc.textContent = '$' + (me ? me.score : 0);

  const status = document.getElementById('status');
  const preview = document.getElementById('cluePreview');
  const playing = state.show.phase === 'playing';

  if (state.show.phase === 'idle') {
    status.textContent = "🍿 Show hasn't started — hang tight!";
    preview.textContent = 'The host will reveal the categories soon…';
    buzzBtn.disabled = true; buzzBtn.classList.remove('ready'); buzzBtn.classList.add('locked');
  } else if (state.show.phase === 'revealing') {
    const shown = state.board.slice(0, state.show.revealed).map(c => c.title).join(' • ');
    status.textContent = '📺 Categories are being revealed…';
    preview.textContent = shown || '…';
    buzzBtn.disabled = true; buzzBtn.classList.remove('ready'); buzzBtn.classList.add('locked');
  } else {
    document.getElementById('wagerView').style.display = 'none';
    if (state.current && state.current.dd) renderDD(state, status, preview, me);
    else {
    preview.textContent = state.current
      ? `${state.board[state.current.cat].title} • $${state.current.value}`
      : 'No clue open right now.';
    renderBuzz(state, status);
    }
  }

  const sorted = [...state.players].sort((a, b) => b.score - a.score);
  document.getElementById('scores').innerHTML = sorted.map(p =>
    `<div class="score-chip${p.id === J.getClientId() ? ' winner' : ''}"><div class="n">${escapeHtml(p.name)}</div><div class="s${p.score < 0 ? ' neg' : ''}">$${p.score}</div></div>`
  ).join('');
}

document.getElementById('wagerBtn').onclick = () => {
  const v = Number(document.getElementById('wagerInput').value) || 0;
  sock.send({ type: 'wager', amount: v, clientId: J.getClientId() });
};

function topRemaining(state) {
  let m = 200;
  state.board.forEach((c) => c.clues.forEach((cl) => { if (!cl.answered && cl.value > m) m = cl.value; }));
  return m;
}

function renderDD(state, status, preview, me) {
  const cur = state.current;
  const myId = J.getClientId();
  const ddP = state.players.find((p) => p.id === cur.ddPlayer);
  buzzBtn.disabled = true; buzzBtn.classList.remove('ready'); buzzBtn.classList.add('locked');
  const wv = document.getElementById('wagerView');
  if (!cur.ddPlayer) {
    wv.style.display = 'none';
    status.textContent = '⭐ DAILY DOUBLE — host picks who found it…';
    preview.textContent = 'Question secret until the wager is in 🤫';
  } else if (cur.wager == null) {
    if (cur.ddPlayer === myId) {
      const max = Math.max(topRemaining(state), me ? me.score : 0);
      wv.style.display = '';
      document.getElementById('wagerMax').textContent = '$' + max;
      document.getElementById('wagerScore').textContent = '$' + (me ? me.score : 0);
      document.getElementById('wagerInput').max = max;
      status.textContent = '⭐ YOUR Daily Double — set your wager!';
      preview.textContent = 'Question secret until you wager 🤫';
    } else {
      wv.style.display = 'none';
      status.textContent = `⭐ ${ddP ? ddP.name : '?'} is playing Daily Double…`;
      preview.textContent = 'Sit back — no buzzers on a DD 🤫';
    }
  } else {
    wv.style.display = 'none';
    status.textContent = `⭐ DD: ${ddP ? ddP.name : '?'} wagered $${cur.wager} — good luck!`;
    preview.textContent = `${state.board[cur.cat].title} • ⭐ DD $${cur.wager}`;
  }
}

function renderBuzz(state, status) {
  const myId = J.getClientId();
  const struckOut = (state.buzz.wrongIds || []).includes(myId);
  const canBuzz = !!(state.current && state.buzz.open && !struckOut &&
    !state.buzz.order.includes(myId));
  const iWon = state.buzz.winnerId === myId;
  const iQueued = state.buzz.order.includes(myId);

  buzzBtn.disabled = !canBuzz;
  buzzBtn.classList.toggle('ready', canBuzz);
  buzzBtn.classList.toggle('locked', !canBuzz); // blurred once you're out / beaten
  if (!state.current) { status.textContent = 'Waiting for host… 👀'; }
  else if (struckOut) { status.textContent = '❌ Wrong — you sit out this clue'; }
  else if (iWon) { status.textContent = '🎉 YOU BUZZED FIRST — answer!'; }
  else if (iQueued) { status.textContent = 'In queue… #' + (state.buzz.order.indexOf(myId) + 1); }
  else if (state.buzz.winnerId) {
    const w = state.players.find(p => p.id === state.buzz.winnerId);
    status.textContent = `🔔 ${w ? w.name : '?'} buzzed first`;
  }
  else if (state.buzz.open) { status.textContent = '⚡ BUZZ NOW!'; }
  else { status.textContent = 'Listen… buzzers closed 🔒'; }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
